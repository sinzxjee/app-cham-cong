<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chấm công">
  <meta name="description" content="Chấm công cá nhân, tính lương ca đêm và ngày lễ. Dữ liệu lưu trong trình duyệt.">
  <title>Chấm công cá nhân</title>
  <link rel="icon" href="app-icon.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="app-icon.jpg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=4">
  <script src="app.js?v=4" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img class="app-icon" src="app-icon.jpg" alt="">
        <div><div class="eyebrow">Sổ công cá nhân</div><h1>Chấm công</h1></div>
      </div>
      <button class="icon-button" id="gear" type="button" aria-label="Thiết lập tính lương" title="Thiết lập tính lương">⚙</button>
    </header>

    <section class="overview" aria-label="Tổng quan">
      <div class="overview-main"><span class="overline">Tổng lương ước tính</span><strong id="total">0 ₫</strong><span class="local-note">Dữ liệu lưu trên trình duyệt này</span></div>
      <div class="overview-stats"><div><span>Số ca</span><strong id="count">0</strong></div><div><span>Giờ đêm</span><strong id="night">0</strong></div></div>
    </section>

    <section class="work-section" aria-labelledby="work-title">
      <div class="section-head"><div><span class="eyebrow">Lịch sử làm việc</span><h2 id="work-title">Các ca làm</h2></div>
        <div class="section-actions">
          <button class="primary desktop-add" id="add" type="button"><span aria-hidden="true">＋</span> Thêm ca làm</button>
          <details class="more" id="more"><summary aria-label="Tùy chọn khác" title="Tùy chọn khác">•••</summary><div class="more-menu"><button id="csv" type="button">Xuất dữ liệu CSV</button><button id="clear" type="button" class="delete-all">Xóa tất cả ca</button></div></details>
        </div>
      </div>
      <div id="list" class="shift-list" aria-live="polite"></div>
    </section>
  </main>

  <div class="mobile-action"><button class="primary" id="add-mobile" type="button"><span aria-hidden="true">＋</span> Thêm ca làm</button></div>

  <dialog id="dlg"><form method="dialog" class="modal">
    <div class="modal-head"><div><span class="eyebrow">Cá nhân hóa</span><h2>Thiết lập tính lương</h2></div><button type="button" class="icon-button close" id="close-settings" aria-label="Đóng">×</button></div>
    <div class="settings-grid">
      <label>Lương mỗi giờ <span>₫</span><input id="rate" type="number" min="0" step="500" inputmode="decimal"></label>
      <label>Thời gian nghỉ mỗi ca <span>giờ</span><input id="break" type="number" min="0" max="8" step="0.25" inputmode="decimal"></label>
      <label>Phụ cấp đêm <span>%</span><input id="bonus" type="number" min="0" step="1" inputmode="numeric"></label>
      <label>Hệ số lễ/Tết <span>%</span><input id="holidayRate" type="number" min="100" step="1" inputmode="numeric"></label>
    </div>
    <p class="note">Giờ đêm từ 22:00 đến 02:00. Ca lễ/Tết được tính 300% lương cơ bản và cộng phụ cấp đêm.</p>
    <div class="modal-actions"><button type="button" class="secondary" id="cancel-settings">Hủy</button><button class="primary" id="save" type="submit">Lưu thiết lập</button></div>
  </form></dialog>
</body>
</html>
