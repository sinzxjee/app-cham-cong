<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c33"><title>Chấm công</title><style>
:root{--g:#123c33;--ink:#17332d;--muted:#6b7975;--gold:#f0ba4d;--line:#d9ddd7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7f4ed,#eaf2ee);color:var(--ink);font:15px system-ui,-apple-system,sans-serif;min-height:100vh}button,input{font:inherit}.app{width:min(1050px,100%);margin:auto;padding:16px 14px 110px}.head{display:flex;justify-content:space-between;align-items:center}.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#58766e;font-weight:800}h1{font:700 clamp(30px,7vw,48px) Georgia,serif;margin:3px 0 18px}.gear,.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800}.gear{background:white;border:1px solid var(--line)}.sum{background:var(--g);color:white;border-radius:24px;padding:20px;display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:16px;box-shadow:0 16px 40px #18372f22}.sum small{color:#bad4cc;text-transform:uppercase;font-size:11px;letter-spacing:.08em}.sum b{display:block;font-size:clamp(23px,5vw,36px);margin-top:5px}.sum .total b{color:#ffe1a2}.bar{display:flex;gap:9px;margin:16px 0;flex-wrap:wrap}.add{background:var(--gold);color:#3a2a0a}.plain{background:#fff;border:1px solid var(--line)}.danger{background:#fff0ec;color:#a63d31}.grow{flex:1}.labels,.row{display:grid;grid-template-columns:1.1fr .8fr .8fr .7fr .7fr .8fr 1.1fr 40px;gap:9px;align-items:center}.labels{padding:0 14px 7px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}.row{background:#fffdf9;border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:10px}.f label{display:none}.f input{width:100%;min-height:43px;border:1px solid var(--line);border-radius:11px;padding:9px;background:white}.m small{display:block;color:var(--muted)}.holiday{display:flex;gap:8px;align-items:center;font-weight:800}.holiday input{width:23px;height:23px;accent-color:var(--g)}.x{border:0;border-radius:11px;background:#f3ece6;color:#994a3e;width:37px;height:37px;font-size:20px}.empty{text-align:center;padding:40px;border:1px dashed #b9c6c0;border-radius:20px;color:var(--muted);background:#ffffff88}dialog{border:0;border-radius:22px;width:min(440px,calc(100% - 24px));padding:0;box-shadow:0 25px 80px #0005}dialog::backdrop{background:#0b241e88}.modal{padding:22px}.modal h2{margin:0 0 16px;font:700 27px Georgia,serif}.modal label{display:block;font-weight:700;margin:12px 0}.modal input{display:block;width:100%;padding:11px;margin-top:6px;border:1px solid var(--line);border-radius:11px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.note{font-size:13px;color:var(--muted);line-height:1.5}
@media(max-width:740px){.app{padding:13px 11px 120px}.sum{grid-template-columns:1fr 1fr}.sum .total{grid-column:1/-1}.labels{display:none}.row{grid-template-columns:1fr 1fr;position:relative;padding:14px 12px;gap:12px}.f.date{grid-column:1/-1}.f label{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:5px}.m{background:#eff4f1;padding:9px;border-radius:11px}.holiday{grid-column:1/-1;background:#fff3d6;padding:10px;border-radius:11px}.x{position:absolute;right:18px;top:15px}.bar{position:sticky;bottom:8px;z-index:3;background:#f6f4edea;backdrop-filter:blur(8px);padding:8px 0}.add{flex:1}.grow{display:none}}
</style></head><body><main class="app"><header class="head"><div><div class="kicker">Sổ công cá nhân</div><h1>Chấm công</h1></div><button class="gear" id="gear">⚙ Thiết lập</button></header><section class="sum"><div class="total"><small>Tổng lương</small><b id="total">0 ₫</b></div><div><small>Số ca</small><b id="count">0</b></div><div><small>Giờ đêm</small><b id="night">0</b></div></section><div class="bar"><button class="btn add" id="add">＋ Thêm ca làm</button><button class="btn plain" id="csv">Xuất CSV</button><span class="grow"></span><button class="btn danger" id="clear">Xóa tất cả</button></div><div class="labels"><span>Ngày</span><span>Giờ vào</span><span>Giờ ra</span><span>Giờ công</span><span>Giờ đêm</span><span>Lễ/Tết</span><span>Tiền lương</span><span></span></div><section id="list"></section></main><dialog id="dlg"><form method="dialog" class="modal"><h2>Thiết lập tính lương</h2><label>Lương mỗi giờ<input id="rate" type="number" min="0" step="500"></label><label>Thời gian nghỉ mỗi ca (giờ)<input id="break" type="number" min="0" max="8" step=".25"></label><label>Phụ cấp đêm (%)<input id="bonus" type="number" min="0"></label><label>Hệ số lễ/Tết (%)<input id="holidayRate" type="number" min="100"></label><p class="note">Ca đêm: 22:00–02:00. Khi tích Lễ/Tết, lương giờ công được nhân 300% và vẫn cộng phụ cấp đêm.</p><div class="actions"><button class="btn plain" value="cancel">Hủy</button><button class="btn add" id="save" value="default">Lưu</button></div></form></dialog><script>
const KEY="cham-cong-mobile-v1";let S=JSON.parse(localStorage.getItem(KEY)||"null")||{settings:{rate:26500,break:0.5,bonus:30,holidayRate:300},rows:[]};const q=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat("vi-VN",{style:"currency",currency:"VND",maximumFractionDigits:0}).format(n||0),dec=n=>new Intl.NumberFormat("vi-VN",{maximumFractionDigits:2}).format(n||0);function min(t){if(!t)return 0;let p=t.split(":").map(Number);return p[0]*60+p[1]}function calc(r){if(!r.start||!r.end)return{hours:0,night:0,pay:0};let a=min(r.start),b=min(r.end);if(b<=a)b+=1440;let ov=(c,d)=>Math.max(0,Math.min(b,d)-Math.max(a,c)),night=(ov(0,120)+ov(1320,1440)+ov(1440,1560))/60,hours=Math.max(0,(b-a)/60-S.settings.break),base=hours*S.settings.rate*(r.holiday?S.settings.holidayRate/100:1);return{hours:hours,night:night,pay:base+night*S.settings.rate*S.settings.bonus/100}}function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}function render(){let list=q("#list"),total=0,night=0;list.innerHTML="";S.rows.forEach(r=>{let c=calc(r);total+=c.pay;night+=c.night;let el=document.createElement("article");el.className="row";el.innerHTML='<div class="f date"><label>Ngày làm</label><input type="date" data-k="date" value="'+(r.date||"")+'"></div><div class="f"><label>Giờ vào</label><input type="time" data-k="start" value="'+(r.start||"")+'"></div><div class="f"><label>Giờ ra</label><input type="time" data-k="end" value="'+(r.end||"")+'"></div><div class="m"><small>Giờ công</small><b>'+dec(c.hours)+'</b></div><div class="m"><small>Giờ đêm</small><b>'+dec(c.night)+'</b></div><label class="holiday"><input type="checkbox" data-k="holiday" '+(r.holiday?"checked":"")+'> Lễ/Tết</label><div class="m"><small>Tiền lương</small><b>'+fmt(c.pay)+'</b></div><button class="x" aria-label="Xóa ca">×</button>';el.querySelectorAll("[data-k]").forEach(i=>i.onchange=()=>{r[i.dataset.k]=i.type==="checkbox"?i.checked:i.value;save()});el.querySelector(".x").onclick=()=>{S.rows=S.rows.filter(x=>x.id!==r.id);save()};list.appendChild(el)});if(!S.rows.length)list.innerHTML='<div class="empty"><b>Chưa có ca làm nào</b><br>Nhấn “Thêm ca làm” để bắt đầu.</div>';q("#total").textContent=fmt(total);q("#count").textContent=S.rows.length;q("#night").textContent=dec(night)}q("#add").onclick=()=>{S.rows.unshift({id:crypto.randomUUID(),date:new Date().toISOString().slice(0,10),start:"09:00",end:"17:00",holiday:false});save()};q("#gear").onclick=()=>{Object.keys(S.settings).forEach(k=>q("#"+k).value=S.settings[k]);q("#dlg").showModal()};q("#save").onclick=e=>{e.preventDefault();Object.keys(S.settings).forEach(k=>S.settings[k]=Number(q("#"+k).value));q("#dlg").close();save()};q("#clear").onclick=()=>{if(confirm("Xóa toàn bộ ca làm đã nhập?")){S.rows=[];save()}};q("#csv").onclick=()=>{let rows=[["Ngày","Giờ vào","Giờ ra","Giờ công","Giờ đêm","Lễ/Tết","Tiền lương"]];S.rows.slice().reverse().forEach(r=>{let c=calc(r);rows.push([r.date,r.start,r.end,c.hours,c.night,r.holiday?"Có":"Không",Math.round(c.pay)])});let blob=new Blob(["\ufeff"+rows.map(x=>x.join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cham-cong.csv";a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
