<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123c33"><title>Chấm công</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="head"><div><div class="kicker">Sổ công cá nhân</div><h1>Chấm công</h1></div><button class="gear" id="gear">⚙ Thiết lập</button></header><section class="sum"><div class="total"><small>Tổng lương</small><b id="total">0 ₫</b></div><div><small>Số ca</small><b id="count">0</b></div><div><small>Giờ đêm</small><b id="night">0</b></div></section><div class="bar"><button class="btn add" id="add">＋ Thêm ca làm</button><button class="btn plain" id="csv">Xuất CSV</button><button class="btn plain" id="sync">↻ Đồng bộ Sheet</button><span class="grow"></span><button class="btn danger" id="clear">Xóa tất cả</button></div><div class="labels"><span>Ngày</span><span>Giờ vào</span><span>Giờ ra</span><span>Giờ công</span><span>Giờ đêm</span><span>Lễ/Tết</span><span>Tiền lương</span><span></span></div><section id="list"></section></main><dialog id="dlg"><form method="dialog" class="modal"><h2>Thiết lập tính lương</h2><label>Lương mỗi giờ<input id="rate" type="number" min="0" step="500"></label><label>Thời gian nghỉ mỗi ca (giờ)<input id="break" type="number" min="0" max="8" step=".25"></label><label>Phụ cấp đêm (%)<input id="bonus" type="number" min="0"></label><label>Hệ số lễ/Tết (%)<input id="holidayRate" type="number" min="100"></label><label>URL Apps Script<input id="syncUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Khóa đồng bộ<input id="syncKey" type="password" autocomplete="off"></label><div id="syncStatus" class="sync-status">Chưa cấu hình đồng bộ</div><p class="note">Ca đêm: 22:00–02:00. Khi tích Lễ/Tết, lương giờ công được nhân 300% và vẫn cộng phụ cấp đêm.</p><div class="actions"><button class="btn plain" value="cancel">Hủy</button><button class="btn add" id="save" value="default">Lưu</button></div></form></dialog><script src="app.js" defer></script></body></html>
